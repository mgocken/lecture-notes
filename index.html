<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ders Notları</title>
<style>
:root{--bg:#fbfaf8;--fg:#1f2328;--heading:#10141a;--muted:#5b6570;--accent:#0b6bcb;--rule:#e2ded6}
@media (prefers-color-scheme:dark){:root{--bg:#16181d;--fg:#d7dae0;--heading:#f0f2f5;--muted:#9aa3ad;--accent:#6cb6ff;--rule:#2c3038}}
html{background:var(--bg)}
body{background:var(--bg);color:var(--fg);max-width:44em;margin:0 auto;padding:2.5rem 1.4rem 5rem;font:16px/1.65 -apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif}
h1{color:var(--heading);font-size:2rem;line-height:1.25;margin-bottom:.2em}
p.lead{color:var(--muted);margin-top:0}
a{color:var(--accent)}
ol{padding-left:1.6em}
ol li{margin:1.1em 0}
a.t{font-weight:600;font-size:1.08em;text-decoration:none}
a.t:hover{text-decoration:underline}
.s{display:block;color:var(--muted)}
a.src{font-size:.85em;text-decoration:none}
footer{margin-top:3em;padding-top:1em;border-top:1px solid var(--rule);color:var(--muted);font-size:.9em}
</style>
</head>
<body>
<h1>Ders Notları</h1>
<p class="lead">Öğrenciler için hazırlanan ders notları (handout).</p>

<ol>
  <li>
    <a class="t" href="dp-handouts/">Dinamik Programlama</a>
    <span class="s">1 not — en kısa yol, envanter, sırt çantası, makine değiştirme, olasılıklı karar</span>
  </li>
</ol>

<footer>
<p><a href="https://github.com/mgocken/lecture-notes">GitHub</a></p>
</footer>
</body>
</html>
